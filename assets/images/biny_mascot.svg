<svg width="260" height="280" viewBox="0 0 260 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="130" cy="265" rx="55" ry="10" fill="#5B3FD6" fill-opacity="0.12"/>

  <!-- Left Arm -->
  <rect x="18" y="135" width="32" height="60" rx="16" fill="#7B5FE7" transform="rotate(-15 18 135)"/>
  <!-- Right Arm -->
  <rect x="210" y="135" width="32" height="60" rx="16" fill="#7B5FE7" transform="rotate(15 210 135)"/>

  <!-- Left Leg -->
  <rect x="88" y="215" width="28" height="40" rx="14" fill="#7B5FE7"/>
  <!-- Right Leg -->
  <rect x="144" y="215" width="28" height="40" rx="14" fill="#7B5FE7"/>

  <!-- Body (trash bin shape) -->
  <rect x="55" y="90" width="150" height="140" rx="30" fill="#6A4C93"/>
  <!-- Body highlight -->
  <rect x="65" y="100" width="130" height="120" rx="24" fill="#7B5FE7"/>

  <!-- Body stripe -->
  <rect x="85" y="170" width="90" height="8" rx="4" fill="#5B3FD6" fill-opacity="0.3"/>

  <!-- Face area -->
  <ellipse cx="130" cy="135" rx="55" ry="45" fill="#8B6FE8"/>

  <!-- Left Eye (white) -->
  <ellipse cx="108" cy="125" rx="18" ry="20" fill="white"/>
  <!-- Left Eye (iris) -->
  <ellipse cx="110" cy="125" rx="10" ry="12" fill="#2B2A45"/>
  <!-- Left Eye (pupil) -->
  <ellipse cx="112" cy="122" rx="5" ry="5" fill="white"/>

  <!-- Right Eye (white) -->
  <ellipse cx="152" cy="125" rx="18" ry="20" fill="white"/>
  <!-- Right Eye (iris) -->
  <ellipse cx="154" cy="125" rx="10" ry="12" fill="#2B2A45"/>
  <!-- Right Eye (pupil) -->
  <ellipse cx="156" cy="122" rx="5" ry="5" fill="white"/>

  <!-- Smile -->
  <path d="M 112 152 Q 130 168 148 152" stroke="#2B2A45" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Cheeks (blush) -->
  <ellipse cx="88" cy="148" rx="10" ry="7" fill="#FF9EC6" fill-opacity="0.4"/>
  <ellipse cx="172" cy="148" rx="10" ry="7" fill="#FF9EC6" fill-opacity="0.4"/>

  <!-- Hat / Lid -->
  <rect x="60" y="72" width="140" height="28" rx="10" fill="#5B3FD6"/>
  <rect x="70" y="58" width="120" height="22" rx="8" fill="#6A4C93"/>

  <!-- Hat camera lens -->
  <circle cx="130" cy="48" r="14" fill="#4CAF50"/>
  <circle cx="130" cy="48" r="8" fill="#66BB6A"/>
  <circle cx="130" cy="48" r="4" fill="white" fill-opacity="0.6"/>

  <!-- Stars -->
  <g transform="translate(82, 52)">
    <path d="M 0,-7 L 2,-2 L 7,-2 L 3,1 L 5,7 L 0,3 L -5,7 L -3,1 L -7,-2 L -2,-2 Z" fill="#FFD700"/>
  </g>
  <g transform="translate(178, 52)">
    <path d="M 0,-7 L 2,-2 L 7,-2 L 3,1 L 5,7 L 0,3 L -5,7 L -3,1 L -7,-2 L -2,-2 Z" fill="#FFD700"/>
  </g>
</svg>
