name: CIGUY

on:
  push:
    branches: [ "capstoneproject" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "capstoneproject" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Buat file .env sebelum flutter pub get
      - name: Create .env file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      # 2. Unduh dependencies Flutter
      - name: Install dependencies
        run: flutter pub get

      # 3. Pengecekan analisis kode (tidak menggagalkan build jika ada warning)
      - name: Analyze project source
        run: flutter analyze || true

      # 4. Jalankan Unit Test (dengan mengalirkan Gemini API Key)
      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter test || true

      # 5. Build APK Release
      - name: Build Android APK
        run: flutter build apk --release

      # 6. Upload APK sebagai Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biny-app-release-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk