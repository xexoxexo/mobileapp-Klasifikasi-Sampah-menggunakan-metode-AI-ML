<rect class="edge-label-bg" x="563.9" y="1174" width="132.2" height="26" rx="4"/><text class="edge-label" x="630" y="1192">imageFileName</text>
<rect class="edge-label-bg" x="398.4" y="807" width="243.20000000000002" height="26" rx="4"/><text class="edge-label" x="520" y="825">save confirmed / reuse match</text>
</g><g><rect x="70" y="1405" width="1750" height="64" rx="6" fill="#f8fafc" stroke="#d0d5dd"/><text class="legend-title" x="92" y="1438">Catatan:</text><text class="legend-text" x="172" y="1438">ERD ini bersifat logis/domain. App saat ini memakai Riverpod state, SharedPreferences, Hive box, dan file JPEG lokal, bukan satu skema SQL fisik.</text><text class="legend-text" x="172" y="1458">Urutan output ML: Kaca(0), Kertas(1), Logam(2), Organik(3), Plastik(4), Residu(5). Lainnya hanya kategori UI/unknown.</text></g></svg>