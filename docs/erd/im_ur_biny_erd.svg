<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1500" viewBox="0 0 1900 1500"><defs><marker id="crow" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="strokeWidth"><path d="M 2 2 L 16 8 L 2 14 M 2 8 L 16 8" fill="none" stroke="#475467" stroke-width="1.8" stroke-linecap="round"/></marker><style><![CDATA[.page-title{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#101828}.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#475467}.entity-shadow{fill:rgba(16,24,40,.10)}.entity-box{fill:#fff;stroke:#98a2b3;stroke-width:1.4}.entity-title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#fff;letter-spacing:0}.entity-badge{fill:#f2f4f7;stroke:#e4e7ec}.entity-kind{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#344054}.field{font-family:Consolas,'Courier New',monospace;font-size:16px;fill:#101828}.pk{font-weight:700;fill:#7f1d1d}.fk{font-weight:700;fill:#064e3b}.noteField{fill:#475467;font-size:14px}.edge-label-bg{fill:#fff;stroke:#e4e7ec}.edge-label{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#344054;text-anchor:middle}.cardinality{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#101828}.legend-title{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#101828}.legend-text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#344054}.note-text{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;fill:#9a3412}]]></style></defs><rect x="0" y="0" width="1900" height="1500" fill="#fff"/><text class="page-title" x="70" y="60">ERD - I'm ur Biny</text><text class="subtitle" x="70" y="91">Domain data untuk Flutter app pemilah sampah ML/AI, single dan mixed scan</text><g><rect x="695" y="75" width="1125" height="48" rx="6" fill="#fff7ed" stroke="#fdba74"/><text class="note-text" x="720" y="105">Pipeline: LocalDataset lookup -> RT-DETR on-device -> TFLite fallback -> Gemini cloud retry/escalation. Output akhirnya selalu menjadi ScanResult.</text></g><g class="edge" id="e_session_result"><path d="M 490,310 L 610,310 L 610,310 L 695,310" fill="none" stroke="#475467" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="500" y="302">1</text><text class="cardinality" x="661" y="302">0..*</text></g><g class="edge" id="e_context_result"><path d="M 490,705 L 610,705 L 610,535 L 695,535" fill="none" stroke="#475467" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="500" y="697">1</text><text class="cardinality" x="661" y="527">0..*</text></g><g class="edge" id="e_result_category"><path d="M 1195,320 L 1268,320 L 1268,310 L 1340,310" fill="none" stroke="#475467" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="1205" y="312">0..*</text><text class="cardinality" x="1306" y="302">1</text></g><g class="edge" id="e_result_original_category"><path d="M 1195,430 L 1255,430 L 1255,468 L 1340,468" fill="none" stroke="#475467" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="1205" y="422">0..*</text><text class="cardinality" x="1306" y="460">0..1</text></g><g class="edge" id="e_category_step"><path d="M 1580,535 L 1580,610" fill="none" stroke="#475467" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="1590" y="527">1</text><text class="cardinality" x="1546" y="602">0..*</text></g><g class="edge" id="e_result_probability"><path d="M 1195,590 L 1265,590 L 1265,1135 L 1340,1135" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="1205" y="582">1</text><text class="cardinality" x="1306" y="1127">0..*</text></g><g class="edge" id="e_result_region"><path d="M 945,655 L 945,740" fill="none" stroke="#7e22ce" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="955" y="647">1</text><text class="cardinality" x="911" y="732">0..1</text></g><g class="edge" id="e_dataset_category"><path d="M 580,1085 L 1265,1085 L 1265,505 L 1340,505" fill="none" stroke="#047857" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="590" y="1077">0..*</text><text class="cardinality" x="1306" y="497">1</text></g><g class="edge" id="e_dataset_file"><path d="M 580,1210 L 695,1210" fill="none" stroke="#047857" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="590" y="1202">1</text><text class="cardinality" x="661" y="1202">1</text></g><g class="edge" id="e_result_dataset"><path d="M 695,610 L 635,610 L 635,1010 L 580,1010" fill="none" stroke="#047857" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#crow)"/><text class="cardinality" x="705" y="602">0..*</text><text class="cardinality" x="546" y="1002">0..1</text></g><g class="entity" id="user_session"><rect class="entity-shadow" x="74" y="150" width="420" height="330" rx="6"/><rect class="entity-box" x="70" y="145" width="420" height="330" rx="6"/><rect x="70" y="145" width="420" height="54" rx="6" fill="#2563eb"/><rect x="70" y="191" width="420" height="8" fill="#2563eb"/><text class="entity-title" x="92" y="180">USER_SESSION</text><rect class="entity-badge" x="88" y="211" width="384" height="28" rx="4"/><text class="entity-kind" x="102" y="231">Persistence: SharedPreferences</text><text class="field pk" x="92" y="253">PK session_id (logical)</text><text class="field" x="92" y="279">userName : String</text><text class="field" x="92" y="305">totalXP : int</text><text class="field" x="92" y="331">scanCount : int</text><text class="field" x="92" y="357">correctionCount : int</text><text class="field" x="92" y="383">scanHistory : List&lt;ScanResult&gt; (runtime)</text><text class="field noteField" x="92" y="409">keys: user_name, total_xp, scan_count,</text><text class="field noteField" x="92" y="432">correction_count</text></g><g class="entity" id="scan_context"><rect class="entity-shadow" x="74" y="545" width="420" height="330" rx="6"/><rect class="entity-box" x="70" y="540" width="420" height="330" rx="6"/><rect x="70" y="540" width="420" height="54" rx="6" fill="#7c3aed"/><rect x="70" y="586" width="420" height="8" fill="#7c3aed"/><text class="entity-title" x="92" y="575">SCAN_CONTEXT</text><rect class="entity-badge" x="88" y="606" width="384" height="28" rx="4"/><text class="entity-kind" x="102" y="626">Runtime State: Riverpod</text><text class="field pk" x="92" y="648">PK context_id (logical)</text><text class="field" x="92" y="674">scanMode : single | mixed</text><text class="field" x="92" y="700">selectedCategory? : WasteCategory</text><text class="field" x="92" y="726">capturedImage? : Uint8List</text><text class="field" x="92" y="752">useGemini : bool</text><text class="field noteField" x="92" y="778">lastUsedGemini : bool</text><text class="field" x="92" y="804">selectedDetailIndex : int</text><text class="field" x="92" y="830">reanalyzeMultiIndex? : int</text></g><g class="entity" id="local_dataset_entry"><rect class="entity-shadow" x="74" y="950" width="510" height="350" rx="6"/><rect class="entity-box" x="70" y="945" width="510" height="350" rx="6"/><rect x="70" y="945" width="510" height="54" rx="6" fill="#059669"/><rect x="70" y="991" width="510" height="8" fill="#059669"/><text class="entity-title" x="92" y="980">LOCAL_DATASET_ENTRY</text><rect class="entity-badge" x="88" y="1011" width="474" height="28" rx="4"/><text class="entity-kind" x="102" y="1031">Persistence: Hive box local_dataset</text><text class="field pk" x="92" y="1053">PK sha256Hex : String</text><text class="field" x="92" y="1079">pHash : int</text><text class="field fk" x="92" y="1105">FK category_code : WasteCategory</text><text class="field" x="92" y="1131">itemName? : String</text><text class="field" x="92" y="1157">confidence? : double</text><text class="field" x="92" y="1183">imageFileName : String</text><text class="field" x="92" y="1209">createdAt : DateTime</text><text class="field noteField" x="92" y="1235">dedupe key = sha256Hex; similarity = pHash/Hamming</text></g><g class="entity" id="scan_result"><rect class="entity-shadow" x="699" y="160" width="500" height="500" rx="6"/><rect class="entity-box" x="695" y="155" width="500" height="500" rx="6"/><rect x="695" y="155" width="500" height="54" rx="6" fill="#1d4ed8"/><rect x="695" y="201" width="500" height="8" fill="#1d4ed8"/><text class="entity-title" x="717" y="190">SCAN_RESULT</text><rect class="entity-badge" x="713" y="221" width="464" height="28" rx="4"/><text class="entity-kind" x="727" y="241">Domain Model: lib/core/models/scan_result.dart</text><text class="field pk" x="717" y="263">PK scan_result_id (logical)</text><text class="field" x="717" y="289">itemName : String</text><text class="field fk" x="717" y="315">FK category_code : WasteCategory</text><text class="field" x="717" y="341">confidence : double</text><text class="field" x="717" y="367">disposalInfo : String</text><text class="field" x="717" y="393">description : String</text><text class="field" x="717" y="419">isCorrected : bool</text><text class="field fk" x="717" y="445">FK original_category_code? : WasteCategory</text><text class="field" x="717" y="471">funFact? : String</text><text class="field" x="717" y="497">boundingBox? : Rect</text><text class="field" x="717" y="523">croppedImage? : Uint8List</text><text class="field" x="717" y="549">allProbabilities : Map&lt;String,double&gt;</text></g><g class="entity" id="detected_region"><rect class="entity-shadow" x="699" y="745" width="500" height="300" rx="6"/><rect class="entity-box" x="695" y="740" width="500" height="300" rx="6"/><rect x="695" y="740" width="500" height="54" rx="6" fill="#9333ea"/><rect x="695" y="786" width="500" height="8" fill="#9333ea"/><text class="entity-title" x="717" y="775">DETECTED_REGION</text><rect class="entity-badge" x="713" y="806" width="464" height="28" rx="4"/><text class="entity-kind" x="727" y="826">Transient Detection Data</text><text class="field pk" x="717" y="848">PK region_id (logical)</text><text class="field fk" x="717" y="874">FK scan_result_id (logical)</text><text class="field" x="717" y="900">displayRect : Rect</text><text class="field" x="717" y="926">classificationRect : Rect</text><text class="field" x="717" y="952">imageWidth : int</text><text class="field" x="717" y="978">imageHeight : int</text><text class="field noteField" x="717" y="1004">source: RT-DETR | Validator | Gemini bbox</text></g><g class="entity" id="dataset_image_file"><rect class="entity-shadow" x="699" y="1115" width="500" height="220" rx="6"/><rect class="entity-box" x="695" y="1110" width="500" height="220" rx="6"/><rect x="695" y="1110" width="500" height="54" rx="6" fill="#0f766e"/><rect x="695" y="1156" width="500" height="8" fill="#0f766e"/><text class="entity-title" x="717" y="1145">DATASET_IMAGE_FILE</text><rect class="entity-badge" x="713" y="1176" width="464" height="28" rx="4"/><text class="entity-kind" x="727" y="1196">File Storage</text><text class="field pk" x="717" y="1218">PK imageFileName : String</text><text class="field noteField" x="717" y="1244">path : &lt;app_docs&gt;/dataset/&lt;imageFileName&gt;</text><text class="field" x="717" y="1270">bytes : JPEG</text><text class="field noteField" x="717" y="1296">written by dataset_image_storage_io.dart</text></g><g class="entity" id="waste_category"><rect class="entity-shadow" x="1344" y="150" width="480" height="390" rx="6"/><rect class="entity-box" x="1340" y="145" width="480" height="390" rx="6"/><rect x="1340" y="145" width="480" height="54" rx="6" fill="#0891b2"/><rect x="1340" y="191" width="480" height="8" fill="#0891b2"/><text class="entity-title" x="1362" y="180">WASTE_CATEGORY</text><rect class="entity-badge" x="1358" y="211" width="444" height="28" rx="4"/><text class="entity-kind" x="1372" y="231">Enum / Master Data</text><text class="field pk" x="1362" y="253">PK category_code : enum value</text><text class="field" x="1362" y="279">displayName : String</text><text class="field" x="1362" y="305">subtitle : String</text><text class="field" x="1362" y="331">icon : IconData</text><text class="field" x="1362" y="357">color / softColor : Color</text><text class="field" x="1362" y="383">disposalInfo : String</text><text class="field" x="1362" y="409">eduFact : String</text><text class="field noteField" x="1362" y="435">values: Kaca, Kertas, Logam, Organik, Plastik,</text><text class="field noteField" x="1362" y="458">Residu, Lainnya</text></g><g class="entity" id="disposal_step"><rect class="entity-shadow" x="1344" y="615" width="480" height="290" rx="6"/><rect class="entity-box" x="1340" y="610" width="480" height="290" rx="6"/><rect x="1340" y="610" width="480" height="54" rx="6" fill="#0891b2"/><rect x="1340" y="656" width="480" height="8" fill="#0891b2"/><text class="entity-title" x="1362" y="645">DISPOSAL_STEP</text><rect class="entity-badge" x="1358" y="676" width="444" height="28" rx="4"/><text class="entity-kind" x="1372" y="696">Derived From WasteCategory</text><text class="field pk" x="1362" y="718">PK (category_code, step_order)</text><text class="field fk" x="1362" y="744">FK category_code : WasteCategory</text><text class="field" x="1362" y="770">step_order : int</text><text class="field" x="1362" y="796">title : String</text><text class="field" x="1362" y="822">detail : String</text><text class="field noteField" x="1362" y="848">source: WasteCategoryX.disposalSteps</text></g><g class="entity" id="category_probability"><rect class="entity-shadow" x="1344" y="995" width="480" height="290" rx="6"/><rect class="entity-box" x="1340" y="990" width="480" height="290" rx="6"/><rect x="1340" y="990" width="480" height="54" rx="6" fill="#ea580c"/><rect x="1340" y="1036" width="480" height="8" fill="#ea580c"/><text class="entity-title" x="1362" y="1025">CATEGORY_PROBABILITY</text><rect class="entity-badge" x="1358" y="1056" width="444" height="28" rx="4"/><text class="entity-kind" x="1372" y="1076">Prediction Breakdown</text><text class="field pk" x="1362" y="1098">PK (scan_result_id, category_name)</text><text class="field fk" x="1362" y="1124">FK scan_result_id (logical)</text><text class="field" x="1362" y="1150">category_name : String</text><text class="field" x="1362" y="1176">probability : double</text><text class="field noteField" x="1362" y="1202">source: ScanResult.allProbabilities</text><text class="field noteField" x="1362" y="1228">used by confidence/top-probability UI</text></g><g class="edge-label-layer">
